    <!-- 子域名收集面板 -->
    <div id="panel-subdomain" class="panel">
      <div class="content-card">
        <div class="card-title">子域名收集</div>
        <div class="subdomain-module-desc">通过证书透明度、页面提取和 DNS/HTTP 探测收集子域名</div>
        <div class="panel-actions">
          <button class="btn btn-primary" id="subdomain-scan-btn">CT 证书查询</button>
          <button class="btn btn-secondary" id="subdomain-page-btn">页面提取</button>
          <button class="btn btn-outline" id="subdomain-dns-btn">DNS/HTTP 探测</button>
          <button class="btn btn-outline" id="subdomain-copy-btn" hidden>复制结果</button>
          <button class="btn btn-outline" id="subdomain-export-btn" hidden>导出</button>
        </div>
        <div class="status-bar" id="subdomain-status"></div>
        <div class="subdomain-stats" id="subdomain-stats" hidden></div>

        <div class="subdomain-filter-row">
          <span class="subdomain-filter-label">来源筛选:</span>
          <button class="subdomain-filter-btn active" data-sfilter="all">全部</button>
          <button class="subdomain-filter-btn" data-sfilter="ct">CT证书</button>
          <button class="subdomain-filter-btn" data-sfilter="page">页面提取</button>
          <button class="subdomain-filter-btn" data-sfilter="dns">DNS</button>
          <button class="subdomain-filter-btn" data-sfilter="http">HTTP</button>
          <input type="text" id="subdomain-search" class="input subdomain-filter-search" placeholder="搜索域名...">
        </div>

        <div class="subdomain-results" id="subdomain-results">
          <div class="empty-state">点击「CT 证书查询」通过证书透明度查询子域名</div>
        </div>
      </div>
    </div>
