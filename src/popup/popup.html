<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles/popup/base.css">
  <link rel="stylesheet" href="../styles/popup/favicon.css">
  <link rel="stylesheet" href="../styles/popup/info-gather.css">
  <link rel="stylesheet" href="../styles/popup/link-extract.css">
  <link rel="stylesheet" href="../styles/popup/asset-shodan.css">
  <link rel="stylesheet" href="../styles/popup/history.css">
  <link rel="stylesheet" href="../styles/popup/ruoyi.css">
  <link rel="stylesheet" href="../styles/popup/exif.css">
  <link rel="stylesheet" href="../styles/popup/request-spoofing.css">
  <link rel="stylesheet" href="../styles/popup/vue-js-perm.css">
  <link rel="stylesheet" href="../styles/popup/perm-search-compare.css">
  <link rel="stylesheet" href="../styles/popup/payload-xss.css">
  <link rel="stylesheet" href="../styles/popup/sourcemap-vue-store.css">
</head>
<body>
<div class="lingmou-app">
  <div class="app-header">
    <div class="app-title">灵眸</div>
    <div class="tab-nav-wrapper">
      <button class="tab-page-btn" id="tab-scroll-left">&#9664;</button>
      <div class="tab-grid" id="tab-grid">
        <button class="tab-btn active" data-panel="encoding">编码工具</button>
        <button class="tab-btn" data-panel="favicon">图标识别</button>
        <button class="tab-btn" data-panel="gather">信息收集</button>
        <button class="tab-btn" data-panel="asset">资产测绘</button>
        <button class="tab-btn" data-panel="links">链接提取</button>
        <button class="tab-btn" data-panel="multiurl">URL多开</button>
        <button class="tab-btn" data-panel="history">历史档案</button>
        <button class="tab-btn" data-panel="exif">EXIF查看</button>
        <button class="tab-btn" data-panel="spoof">请求伪造</button>
        <button class="tab-btn" data-panel="vue">Vue分析</button>
        <button class="tab-btn" data-panel="ruoyi">RuoYi路由</button>
        <button class="tab-btn" data-panel="jsctrl">JS控制</button>
        <button class="tab-btn" data-panel="payload">Payload</button>
        <button class="tab-btn" data-panel="xssscan">XSS扫描</button>
        <button class="tab-btn" data-panel="sourcemap">Source Map</button>
      </div>
      <button class="tab-page-btn" id="tab-scroll-right">&#9654;</button>
      <span class="tab-page-indicator" id="tab-page-indicator"></span>
    </div>
  </div>

  <div class="app-main" id="app-main">
  </div>
    <span class="status-left" id="status-text">编码工具</span>
    <div class="status-right">
      <span class="status-time" id="status-time"></span>
      <button class="theme-toggle" id="theme-toggle">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    </div>
  </div>
</div>
<!-- Panel loader (must load before vk-init.js) -->
<script src="panel-loader.js"></script>
<!-- Lazy-loaded on first use: crypto-js, jsrsasign, sm2, sm4, bcrypt, exifr -->
<!-- Core -->
<script src="vk-namespace.js"></script>
<script src="vk-encoding.js"></script>
<script src="vk-jwt.js"></script>
<script src="vk-crypto.js"></script>
<script src="vk-favicon.js"></script>
<!-- Features -->
<script src="vk-hae-rules.js"></script>
<script src="vk-gather.js"></script>
<script src="vk-asset.js"></script>
<script src="vk-links.js"></script>
<script src="vk-multiurl.js"></script>
<script src="vk-tabsave.js"></script>
<script src="vk-exif.js"></script>
<script src="vk-history.js"></script>
<script src="vk-spoof.js"></script>
<script src="vk-payload.js"></script>
<script src="vk-xss.js"></script>
<!-- Source Map (split: state → utils → scanner → render → analysis → actions → re-exporter) -->
<script src="vk-sourcemap-state.js"></script>
<script src="vk-sourcemap-utils.js"></script>
<script src="vk-sourcemap-scanner.js"></script>
<script src="vk-sourcemap-render.js"></script>
<script src="vk-sourcemap-analysis.js"></script>
<script src="vk-sourcemap-actions.js"></script>
<script src="vk-sourcemap.js"></script>
<!-- Vue Analysis (split: state → sub-modules → re-exporter) -->
<script src="vk-vue-state.js"></script>
<script src="vk-vue-detect.js"></script>
<script src="vk-vue-perm-inject.js"></script>
<script src="vk-vue-perm.js"></script>
<script src="vk-vue-jssearch.js"></script>
<script src="vk-vue-compare.js"></script>
<script src="vk-vue-store.js"></script>
<script src="vk-vue.js"></script>
<script src="vk-ruoyi-common.js"></script>
<script src="vk-ruoyi-detect.js"></script>
<script src="vk-ruoyi-hook.js"></script>
<script src="vk-ruoyi-mar.js"></script>
<script src="vk-ruoyi.js"></script>
<script src="vk-jsctrl.js"></script>
<!-- Init (must load last) -->
<script src="vk-init.js"></script>
</body>
</html>
