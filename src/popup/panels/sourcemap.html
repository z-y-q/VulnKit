    <!-- Webpack 映射面板 -->
    <div id="panel-sourcemap" class="panel">
      <div class="content-card">
        <div class="card-title">Webpack 模块映射</div>
        <div class="panel-actions">
          <button class="btn btn-primary" id="sourcemap-scan-btn">扫描[v2]</button>
          <button class="btn btn-sm btn-outline" id="sourcemap-analyze-btn">安全分析</button>
          <button class="btn btn-sm btn-outline" id="sourcemap-copy-all-btn">复制路径</button>
          <button class="btn btn-sm btn-outline" id="sourcemap-copy-tree-btn">目录树</button>
          <button class="btn btn-sm btn-outline" id="sourcemap-load-sources-btn">加载到Sources</button>
          <button class="btn btn-sm btn-outline" id="sourcemap-download-all-btn">下载全部</button>
          <button class="btn btn-sm btn-outline" id="sourcemap-api-btn">提取API</button>
          <button class="btn btn-sm btn-outline" id="sourcemap-export-json-btn">导出JSON</button>
          <button class="btn btn-sm btn-outline" id="sourcemap-export-csv-btn">导出CSV</button>
        </div>
        <div class="sourcemap-status" id="sourcemap-status"></div>
        <div class="sm-progress hidden" id="sm-progress">
          <div class="sm-progress-bar" id="sm-progress-bar"></div>
        </div>
        <div class="sm-timer hidden" id="sm-timer"></div>
        <div class="sm-phases hidden" id="sm-phases">
          <span class="sm-phase" data-phase="1">①运行时</span>
          <span class="sm-phase-divider">→</span>
          <span class="sm-phase" data-phase="2">②SourceMap</span>
          <span class="sm-phase-divider">→</span>
          <span class="sm-phase" data-phase="3">③JS解析</span>
        </div>

        <!-- 搜索过滤 -->
        <input type="text" class="input sourcemap-search-input" id="sourcemap-search-input" placeholder="搜索模块路径..." />

        <!-- 扫描结果列表 -->
        <div id="sourcemap-results" class="sourcemap-results">
          <div class="empty-state">点击「扫描当前页面」提取 Webpack 模块映射</div>
        </div>

        <!-- 安全分析结果 -->
        <div class="content-card card-spacing hidden" id="sm-analysis-card">
          <div class="sourcemap-detail-header">
            <div class="card-title card-title-flat">安全分析结果</div>
            <button class="btn btn-sm btn-outline" id="sm-analysis-close">关闭</button>
          </div>
          <div id="sm-analysis-progress"></div>
          <div id="sm-analysis-results"></div>
        </div>

        <!-- API 端点提取 -->
        <div class="content-card card-spacing hidden" id="sm-api-card">
          <div class="sourcemap-detail-header">
            <div class="card-title card-title-flat">API 端点提取</div>
            <button class="btn btn-sm btn-outline" id="sm-api-close">关闭</button>
          </div>
          <div id="sm-api-list"></div>
        </div>

        <!-- 文件详情（点击模块后显示） -->
        <div class="content-card card-spacing hidden" id="sourcemap-detail-card">
          <div class="sourcemap-detail-header">
            <div class="card-title card-title-flat" id="sourcemap-detail-title">模块源码</div>
            <button class="btn btn-sm btn-outline" id="sourcemap-detail-back">返回列表</button>
          </div>
          <div id="sourcemap-deps-info"></div>
          <div class="panel-actions">
            <button class="btn btn-sm btn-outline" id="sourcemap-copy-src-btn">复制源码</button>
            <button class="btn btn-sm btn-outline" id="sourcemap-download-btn">下载文件</button>
          </div>
          <textarea class="textarea" id="sourcemap-source-code" readonly rows="18" placeholder="模块源码将显示在此处"></textarea>
        </div>
      </div>
    </div>
