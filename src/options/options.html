<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵眸 - 设置</title>
    <link rel="stylesheet" href="../styles/options.css">
</head>
<body>
    <div class="container">
        <h1>灵眸 设置</h1>
        <p>版本: <span id="version"></span></p>

        <div class="section">
            <h3>通用设置</h3>
            <div class="setting">
                <label>
                    <input type="checkbox" id="enableNotifications" checked>
                    启用通知提醒
                </label>
            </div>
            <div class="setting">
                <label>
                    <input type="checkbox" id="enableContextMenu" checked>
                    启用右键菜单
                </label>
            </div>
            <div class="setting">
                <label for="theme">主题选择:</label>
                <select id="theme">
                    <option value="auto">自动</option>
                    <option value="light">浅色</option>
                    <option value="dark">深色</option>
                </select>
            </div>
        </div>

        <div class="section">
            <h3>隐私设置</h3>
            <div class="setting">
                <label>
                    <input type="checkbox" id="storeHistory" checked>
                    保存操作历史
                </label>
            </div>
        </div>

        <div class="section">
            <h3>工具设置</h3>
            <div class="setting">
                <label for="defaultEncoding">默认编码类型:</label>
                <select id="defaultEncoding">
                    <option value="base64">Base64</option>
                    <option value="url">URL编码</option>
                    <option value="html">HTML实体</option>
                    <option value="hex">十六进制</option>
                </select>
            </div>
            <div class="setting">
                <label for="defaultHash">默认哈希算法:</label>
                <select id="defaultHash">
                    <option value="SHA256">SHA-256</option>
                    <option value="SHA1">SHA-1</option>
                    <option value="MD5">MD5 (不推荐)</option>
                </select>
            </div>
        </div>

        <div class="section">
            <h3>规则管理 (HaE)</h3>
            <p style="font-size:12px;color:#999;margin-bottom:10px;">管理 HTTP Analyzer 规则，支持 YAML 导入/导出。</p>
            <div style="display:flex;gap:8px;margin-bottom:10px;">
                <button id="hae-export-yaml">导出 YAML</button>
                <button id="hae-import-yaml">导入 YAML</button>
                <button id="hae-reset-rules">恢复默认规则</button>
            </div>
            <div id="hae-rules-container"></div>
        </div>

        <div class="section">
            <h3>采集过滤</h3>
            <p style="font-size:12px;color:#999;margin-bottom:10px;">
                自定义 Gather 信息收集时过滤的域名。每行一个域名关键词，匹配即排除。留空使用内置默认列表。
            </p>
            <textarea id="domain-exclude-list" rows="6" placeholder="google&#10;facebook&#10;github.com&#10;jquery&#10;analytics&#10;doubleclick&#10;googletagmanager&#10;fontawesome&#10;bootstrapcdn&#10;unpkg.com&#10;cdn."></textarea>
        </div>

        <div class="section">
            <h3>扫描设置</h3>
            <div class="setting">
                <label for="fuzz-default-wordlist">Fuzz 默认字典:</label>
                <select id="fuzz-default-wordlist">
                    <option value="common">通用</option>
                    <option value="backup">备份文件</option>
                    <option value="api">API 路径</option>
                    <option value="sensitive">敏感路径</option>
                </select>
            </div>
            <div class="setting">
                <label for="fuzz-default-concurrency">Fuzz 默认并发数:</label>
                <input type="number" id="fuzz-default-concurrency" min="1" max="20" value="5">
            </div>
            <div class="setting">
                <label for="xss-default-timeout">XSS 探测超时 (ms):</label>
                <input type="number" id="xss-default-timeout" min="3000" max="30000" step="1000" value="10000">
            </div>
        </div>

        <div class="section">
            <h3>工具栏配置</h3>
            <p style="font-size:12px;color:#999;margin-bottom:10px;">拖拽调整顺序，勾选控制显示。至少保留 1 个工具。</p>
            <div id="toolbar-config-list"></div>
            <div style="margin-top:10px;display:flex;gap:8px;">
                <button id="toolbar-reset-order">恢复默认顺序</button>
            </div>
        </div>

        <div class="section">
            <h3>数据管理</h3>
            <button id="export-btn">导出设置</button>
            <button id="import-btn">导入设置</button>
            <button id="clear-btn">清除所有数据</button>
            <button id="reset-btn">重置为默认设置</button>
        </div>

        <div id="status" class="status status-hidden"></div>
    </div>

    <script src="hae-rules.js"></script>
    <script src="options.js"></script>
</body>
</html>
