<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>灵眸 - 提取的链接</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; }
    .container { max-width: 960px; margin: 0 auto; padding: 20px; }
    h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #888; margin-bottom: 16px; word-break: break-all; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
    .toolbar input { flex: 1; min-width: 200px; padding: 6px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; outline: none; }
    .toolbar input:focus { border-color: #4A90E2; }
    .toolbar select { padding: 6px 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; background: #fff; }
    .btn { padding: 6px 14px; border: 1px solid #ddd; border-radius: 6px; background: #fff; cursor: pointer; font-size: 13px; transition: all .15s; }
    .btn:hover { background: #f0f0f0; }
    .btn-primary { background: #4A90E2; color: #fff; border-color: #4A90E2; }
    .btn-primary:hover { background: #3a7bd5; }
    .stats { font-size: 13px; color: #666; margin-bottom: 10px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    th { background: #fafafa; padding: 8px 12px; text-align: left; font-size: 12px; font-weight: 600; color: #666; border-bottom: 1px solid #eee; position: sticky; top: 0; }
    td { padding: 7px 12px; font-size: 13px; border-bottom: 1px solid #f0f0f0; max-width: 0; }
    td.url { max-width: 500px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    td.url:hover { white-space: normal; word-break: break-all; }
    td.text { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    a { color: #4A90E2; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
    .tag-a { background: #e3f0ff; color: #2b6cb0; }
    .tag-img { background: #e6f9e6; color: #27ae60; }
    .tag-script { background: #fff3e0; color: #e67e22; }
    .tag-link { background: #f3e5f5; color: #9b59b6; }
    .tag-iframe { background: #fce4ec; color: #e74c3c; }
    .tag-form { background: #fff8e1; color: #f39c12; }
    .empty { text-align: center; padding: 40px; color: #999; font-size: 14px; }
    .table-wrap { max-height: calc(100vh - 180px); overflow-y: auto; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>灵眸 - 提取的链接</h1>
    <div class="subtitle" id="source-url"></div>
    <div class="toolbar">
      <input type="text" id="search" placeholder="搜索 URL 或文本...">
      <select id="filter-tag">
        <option value="all">全部类型</option>
        <option value="a">链接</option>
        <option value="img">图片</option>
        <option value="script">脚本</option>
        <option value="link">资源</option>
        <option value="iframe">框架</option>
        <option value="form">表单</option>
      </select>
      <button class="btn btn-primary" id="copy-all">复制全部 URL</button>
      <button class="btn" id="export-json">导出 JSON</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th style="width:40px">#</th><th>URL</th><th>文本</th><th style="width:60px">类型</th><th style="width:120px">域名</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
  <script src="extracted-links.js"></script>
</body>
</html>
