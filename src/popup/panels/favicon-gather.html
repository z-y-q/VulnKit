    <!-- 图标识别面板 -->
    <div id="panel-favicon" class="panel">
      <div class="content-card">
        <div class="card-title">网站图标识别</div>
        <div class="panel-actions">
          <button class="btn btn-primary" id="extract-favicon-btn">提取当前页面图标</button>
        </div>
        <div class="card-spacing">
          <div class="favicon-info">
            <div class="favicon-preview">
              <img id="favicon-img" class="hidden" alt="favicon">
              <div id="favicon-placeholder" class="favicon-empty">暂无图标</div>
            </div>
            <div class="favicon-details">
              <div class="detail-row">
                <span class="detail-label">Favicon URL</span>
                <span class="detail-value link-value" id="favicon-url">-</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Hash Values</span>
                <div class="hash-details" id="favicon-hash">-</div>
              </div>
              <div class="detail-row">
                <button class="btn btn-sm btn-outline" id="copy-favicon-url-btn">复制 URL</button>
                <button class="btn btn-sm btn-outline" id="copy-favicon-hash-btn">复制 Hash</button>
              </div>
            </div>
          </div>
        </div>
        <div class="favicon-search-links" id="favicon-search-links"></div>
      </div>
    </div>

    <!-- 信息收集面板 -->
    <div id="panel-gather" class="panel">
      <div class="content-card">
        <div class="card-title">信息收集</div>
        <div class="gather-primary-actions">
          <button class="btn btn-primary" id="gather-btn">收集当前页面</button>
        </div>
        <div class="gather-toolbar">
          <button class="gather-tool-btn" id="gather-copy-btn">复制当前</button>
          <button class="gather-tool-btn" id="gather-copy-all-btn">复制全部</button>
          <span class="gather-tool-divider"></span>
          <button class="gather-tool-btn" id="gather-export-btn">CSV</button>
          <button class="gather-tool-btn" id="gather-export-json-btn">JSON</button>
          <span class="gather-tool-divider"></span>
          <button class="gather-tool-btn" id="gather-rules-btn" title="在设置页管理 HaE 规则">规则</button>
          <button class="gather-tool-btn" id="gather-to-source-btn" title="将收集到的 JS/CSS 链接发送到源码加载面板">源码加载</button>
        </div>
        <div class="gather-filter-row">
          <div class="gather-sub-tabs" id="gather-sub-tabs"></div>
          <input type="text" id="gather-search" class="gather-search-input" placeholder="搜索..." style="display:none;">
        </div>
        <div class="gather-status" id="gather-status"></div>
        <div class="gather-results" id="gather-results">
          <div class="gather-empty-state">
            <div class="gather-empty-icon">&#128269;</div>
            <div class="gather-empty-text">点击上方按钮开始收集页面信息</div>
          </div>
        </div>
      </div>
    </div>
