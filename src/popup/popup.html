    <div class="app-title">灵眸</div>

      <button class="tab-page-btn" id="tab-scroll-left">&#9664;</button>
      <div class="tab-grid" id="tab-grid">
        <button class="tab-btn active" data-panel="encoding">编码工具</button>
        <button class="tab-btn" data-panel="favicon">图标识别</button>
        <button class="tab-btn" data-panel="gather">信息收集</button>
        <button class="tab-btn" data-panel="asset">资产测绘</button>
        <button class="tab-btn" data-panel="links">链接提取</button>
        <button class="tab-btn" data-panel="multiurl">URL多开</button>
        <button class="tab-btn" data-panel="history">历史档案</button>
        <button class="tab-btn" data-panel="exif">EXIF查看</button>
        <button class="tab-btn" data-panel="spoof">请求伪造</button>
        <button class="tab-btn" data-panel="vue">Vue分析</button>
        <button class="tab-btn" data-panel="ruoyi">RuoYi路由</button>
        <button class="tab-btn" data-panel="jsctrl">JS控制</button>

        <button class="tab-btn" data-panel="xssscan">XSS扫描</button>

        <button class="tab-btn" data-panel="cookie-audit">Cookie审计</button>
        <button class="tab-btn" data-panel="react">React分析</button>
        <button class="tab-btn" data-panel="angular">Angular分析</button>
        <button class="tab-btn" data-panel="cors">CORS检测</button>
        <button class="tab-btn" data-panel="subdomain">子域名</button>
        <button class="tab-btn" data-panel="source-loader">源码加载</button>
      </div>
      <button class="tab-page-btn" id="tab-scroll-right">&#9654;</button>
      <span class="tab-page-indicator" id="tab-page-indicator"></span>
    </div>
  </div>

  <div class="app-main" id="app-main">
  </div>
    <span class="status-left" id="status-text">编码工具</span>
    <div class="status-right">
      <span class="status-time" id="status-time"></span>
      <button class="theme-toggle" id="settings-btn" title="设置">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>

      </button>
      <button class="theme-toggle" id="theme-toggle">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    </div>
  </div>
</div>
