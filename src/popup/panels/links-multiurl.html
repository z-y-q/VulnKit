    <!-- 链接提取面板 -->
    <div id="panel-links" class="panel">
      <div class="content-card">
        <div class="card-title">链接提取</div>
        <div class="link-actions">
          <button class="btn btn-primary" id="links-extract-btn">提取链接</button>
          <button class="btn btn-sm btn-outline" id="links-copy-btn">复制筛选结果</button>
          <button class="btn btn-sm btn-outline" id="links-export-btn">导出</button>
          <button class="btn btn-sm btn-secondary" id="links-send-multiurl-btn">发送到URL多开</button>
        </div>
        <div class="link-filter-row">
          <input type="text" id="links-filter" class="input" placeholder="筛选关键词...">
          <select id="links-filter-type" class="select-filter">
            <option value="all">全部类型</option>
            <option value="a">链接(a)</option>
            <option value="img">图片(img)</option>
            <option value="script">脚本(script)</option>
            <option value="link">资源(link)</option>
            <option value="iframe">框架(iframe)</option>
            <option value="external">外部链接</option>
            <option value="internal">内部链接</option>
          </select>
        </div>
        <div class="links-stats" id="links-stats"></div>
        <div class="link-count" id="links-count"></div>
        <div class="link-results" id="links-results">
          <div class="empty-state">点击「提取链接」开始</div>
        </div>
      </div>
    </div>

    <!-- URL多开面板 -->
    <div id="panel-multiurl" class="panel">
      <div class="content-card">
        <div class="card-title">URL 多开</div>

        <!-- 保存标签页 -->
        <div class="tabsave-section">
          <div class="tabsave-header">保存标签页</div>
          <div class="tabsave-desc">一键获取当前所有浏览器标签页的 URL</div>
          <div class="form-actions">
            <button class="btn btn-primary" id="tabsave-grab-btn">获取所有标签页</button>
            <button class="btn btn-sm btn-secondary" id="tabsave-copy-btn" disabled>复制URL</button>
            <button class="btn btn-sm btn-outline" id="tabsave-export-btn" disabled>导出 .txt</button>
          </div>
          <div class="tabsave-status" id="tabsave-status"></div>
        </div>

        <div class="multiurl-divider"></div>

        <!-- URL多开 -->
        <div class="form-group">
          <label>输入URL（每行一个）</label>
          <textarea class="textarea" id="multiurl-input" placeholder="https://example.com&#10;https://example.org&#10;每行一个URL"></textarea>
        </div>
        <div class="multiurl-info" id="multiurl-info"></div>
        <div class="form-actions">
          <button class="btn btn-primary" id="multiurl-open-btn">批量打开</button>
          <button class="btn btn-secondary" id="multiurl-dedup-btn">去重</button>
          <button class="btn btn-sm btn-secondary" id="multiurl-copy-btn">复制全部</button>
          <button class="btn btn-outline" id="multiurl-clear-btn">清空</button>
        </div>
      </div>
    </div>
