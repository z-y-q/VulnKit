    <!-- 子域名收集面板 -->
    <div id="panel-subdomain" class="panel">
      <div class="content-card">
        <div class="card-title">子域名收集</div>
        <div class="subdomain-module-desc">通过证书透明度、页面提取和 DNS/HTTP 探测收集子域名</div>
        <div class="gather-primary-actions">
          <button class="btn btn-primary" id="subdomain-all-btn">一键全部</button>
        </div>
        <div class="gather-toolbar">
          <button class="gather-tool-btn" id="subdomain-scan-btn">CT 证书查询</button>
          <button class="gather-tool-btn" id="subdomain-certspotter-btn">CertSpotter</button>
          <button class="gather-tool-btn" id="subdomain-archive-btn">Wayback</button>
          <button class="gather-tool-btn" id="subdomain-page-btn">页面提取</button>
          <button class="gather-tool-btn" id="subdomain-dns-btn">DNS/HTTP 探测</button>
          <button class="gather-tool-btn" id="subdomain-dnsrec-btn">DNS 记录</button>
          <span class="gather-tool-divider"></span>
          <button class="gather-tool-btn" id="subdomain-copy-btn" hidden>复制结果</button>
          <button class="gather-tool-btn" id="subdomain-export-btn" hidden>导出</button>
        </div>
        <div class="status-bar" id="subdomain-status"></div>
        <div class="subdomain-stats" id="subdomain-stats" hidden></div>

        <div class="subdomain-filter-row">
          <span class="subdomain-filter-label">来源筛选:</span>
          <button class="subdomain-filter-btn active" data-sfilter="all">全部</button>
          <button class="subdomain-filter-btn" data-sfilter="ct">CT证书</button>
          <button class="subdomain-filter-btn" data-sfilter="page">页面提取</button>
          <button class="subdomain-filter-btn" data-sfilter="dns">DNS</button>
          <button class="subdomain-filter-btn" data-sfilter="http">HTTP</button>
          <button class="subdomain-filter-btn" data-sfilter="certspotter">CS</button>
          <button class="subdomain-filter-btn" data-sfilter="archive">WA</button>
          <input type="text" id="subdomain-search" class="input subdomain-filter-search" placeholder="搜索域名...">
        </div>

        <div class="subdomain-results" id="subdomain-results">
          <div class="gather-empty-state">
            <div class="gather-empty-icon">&#127760;</div>
            <div class="gather-empty-text">点击上方按钮开始收集子域名</div>
          </div>
        </div>
      </div>
    </div>
