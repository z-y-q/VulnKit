name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Toolchain versions
        run: |
          echo "pnpm $(pnpm --version)"
          echo "node $(node --version)"

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run check

      - name: Lint
        run: pnpm run lint

      - name: Verify inject artifacts consistency
        run: |
          # §9.1：验证 inject TS 源文件与 JS 生成物 basename 集合完全一致
          pnpm run build:inject
          git diff --exit-code public/inject || {
            echo "::error::inject 生成物与已提交版本不一致，请本地执行 pnpm run build:inject 并提交"
            exit 1
          }
          # 验证 basename 集合（防止源文件删除后残留旧 JS）
          ts_count=$(ls src/inject/*.ts 2>/dev/null | wc -l | tr -d ' ')
          js_count=$(ls public/inject/*.js 2>/dev/null | wc -l | tr -d ' ')
          if [ "$ts_count" != "$js_count" ]; then
            echo "::error::inject 文件数量不匹配：$ts_count TS vs $js_count JS"
            exit 1
          fi
          echo "✓ inject 生成物一致性验证通过（$ts_count 文件）"

      - name: Verify version consistency
        run: |
          # §10.1：验证 package.json 为版本号唯一来源
          pkg_ver=$(node -p "require('./package.json').version")
          # 检查 wxt.config.ts 是否从 package.json 读取
          if ! grep -q "readFileSync.*package\.json" wxt.config.ts; then
            echo "::error::wxt.config.ts 未从 package.json 读取版本号"
            exit 1
          fi
          # 检查 README.md 版本 badge 是否动态引用
          if grep -E "badge/version-[0-9]+\.[0-9]+\.[0-9]+" README.md; then
            echo "::error::README.md 硬编码了版本号，应使用 dynamic/json badge"
            exit 1
          fi
          # 检查代码中是否残留硬编码版本号（排除注释、测试、配置文件）
          if git grep -E "['\"]7\.[0-9]+\.[0-9]+['\"]" -- 'src/**/*.ts' 'src/**/*.svelte' ':!src/**/*.spec.ts' | grep -v "//"; then
            echo "::error::源代码中发现硬编码版本号，应通过 getAppVersion() 读取"
            exit 1
          fi
          echo "✓ 版本号一致性验证通过（单一来源：package.json v$pkg_ver）"

      - name: Test + coverage
        run: pnpm test:coverage

      - name: Build (Chrome)
        run: pnpm run build

      - name: Build (Firefox)
        run: pnpm run build:firefox

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 7

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .output/
          retention-days: 7
