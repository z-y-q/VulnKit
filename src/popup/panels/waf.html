<div class="panel" id="panel-waf">
  <div class="waf-container">
    <div class="waf-actions">
      <button class="action-btn primary-btn" id="waf-scan-btn">WAF 指纹识别</button>
      <button class="action-btn" id="waf-copy-btn" style="display:none">复制结果</button>
      <button class="action-btn" id="waf-export-btn" style="display:none">导出报告</button>
    </div>
    <div class="status-bar" id="waf-status"></div>
    <div class="waf-probe-info" id="waf-probe-info" style="display:none"></div>
    <div class="waf-results" id="waf-results">
      <div class="empty-state">点击「WAF 指纹识别」对当前网站进行 WAF 检测</div>
    </div>
  </div>
</div>
