    <!-- EXIF查看面板 -->
    <div id="panel-exif" class="panel">
      <div class="content-card">
        <div class="card-title">EXIF 查看器</div>
        <div class="exif-mode-tabs">
          <button class="exif-mode-btn active" data-mode="local">本地上传</button>
          <button class="exif-mode-btn" data-mode="url">网络图片</button>
          <button class="exif-mode-btn" data-mode="page">页面图片</button>
        </div>
        <div id="exif-mode-local">
          <div class="exif-upload-area" id="exif-upload-area">
            <input type="file" id="exif-file-input" accept="image/jpeg,image/heic,image/tiff,image/png,image/webp,.cr2,.nef,.arw,.dng,.rw2,.orf" hidden>
            <div class="exif-upload-hint">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
              <div>拖拽照片到此处 或 点击选择文件</div>
              <div class="exif-upload-formats">支持 JPG / HEIC / TIFF / PNG / WebP / RAW</div>
            </div>
          </div>
        </div>
        <div id="exif-mode-url" class="hidden">
          <div class="exif-url-row">
            <input type="text" id="exif-url-input" class="input" placeholder="输入图片URL，如 https://example.com/photo.jpg" />
            <button id="exif-fetch-btn" class="btn btn-primary">获取</button>
          </div>
        </div>
        <div id="exif-mode-page" class="hidden">
          <div class="exif-page-actions">
            <button class="btn btn-primary" id="exif-scan-page-btn">扫描当前页面图片</button>
          </div>
          <div class="exif-page-images" id="exif-page-images"></div>
        </div>
        <div id="exif-result" class="exif-result hidden">
          <div class="exif-preview-row">
            <img id="exif-preview-img" class="exif-preview" alt="preview">
            <div class="exif-file-info">
              <div class="exif-file-name" id="exif-file-name"></div>
              <div class="exif-file-size" id="exif-file-size"></div>
            </div>
          </div>
          <div class="exif-actions">
            <button class="btn btn-sm btn-outline" id="exif-copy-all-btn">复制全部元数据</button>
            <button class="btn btn-sm btn-outline" id="exif-copy-json-btn">复制 JSON</button>
            <button class="btn btn-sm btn-outline" id="exif-clear-btn">清除</button>
          </div>
          <div class="exif-sections" id="exif-sections"></div>
        </div>
        <div id="exif-empty" class="exif-empty hidden">未检测到 EXIF 元数据</div>
      </div>
    </div>
