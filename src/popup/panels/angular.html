<!-- Angular 分析面板 -->
<div id="panel-angular" class="panel">
  <div class="content-card">
    <div class="card-title">Angular 框架分析</div>
    <div class="angular-sub-tabs">
      <button class="angular-stab active" data-angulartab="detect">基础检测</button>
      <button class="angular-stab" data-angulartab="store">Store 探索</button>
      <button class="angular-stab" data-angulartab="router">路由表</button>
    </div>

    <!-- 基础检测 -->
    <div id="angulartab-detect" class="angular-stab-panel active">
      <div class="angular-module-desc">分析当前页面 Angular 框架版本、模块和路由信息</div>
      <div class="panel-actions">
        <button class="btn btn-primary" id="angular-detect-btn">检测 Angular</button>
        <button class="btn btn-outline" id="angular-copy-btn" style="display:none">复制结果</button>
        <button class="btn btn-outline" id="angular-export-btn" style="display:none">导出 JSON</button>
      </div>
      <div class="status-bar" id="angular-status"></div>
      <div class="angular-results" id="angular-results">
        <div class="empty-state">点击「检测 Angular」分析当前页面的 Angular 框架信息</div>
      </div>
    </div>

    <!-- Store 探索 -->
    <div id="angulartab-store" class="angular-stab-panel">
      <div class="ng-store-actions">
        <button class="btn btn-primary" id="angular-store-read-btn">读取 Store</button>
        <button class="btn btn-sm btn-outline" id="angular-store-copy-btn">复制 JSON</button>
        <button class="btn btn-sm btn-secondary" id="angular-store-refresh-btn">刷新</button>
      </div>
      <div class="status-bar" id="angular-store-status"></div>
      <input type="text" id="angular-store-search" class="input" placeholder="搜索 Store 键名/值..." style="display:none;margin-bottom:8px">
      <div class="ng-store-section-label">Store 数据</div>
      <div class="angular-results" id="angular-store-results">
        <div class="empty-state">点击「读取 Store」探索 NgRx / SignalStore 状态数据</div>
      </div>
      <div class="ng-store-section-label">API 端点</div>
      <div class="angular-results" id="angular-api-results">
        <div class="empty-state">读取 Store 后自动提取</div>
      </div>
    </div>

    <!-- 路由表 -->
    <div id="angulartab-router" class="angular-stab-panel">
      <div class="ng-router-actions">
        <button class="btn btn-primary" id="angular-router-read-btn">读取路由</button>
        <button class="btn btn-sm btn-outline" id="angular-router-copy-btn">复制路由</button>
      </div>
      <div class="status-bar" id="angular-router-status"></div>
      <div class="angular-results" id="angular-routes-results">
        <div class="empty-state">点击「读取路由」提取 Angular Router 路由配置</div>
      </div>
    </div>

  </div>
</div>
